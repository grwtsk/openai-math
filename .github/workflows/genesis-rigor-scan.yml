name: Genesis rigor scan

on:
  push:
    branches:
      - audit/genesis-rigor-scan-20261009
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: genesis-rigor-scan-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static-trust-surface:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          submodules: false
          persist-credentials: false

      - name: Record source and scanner identities
        run: |
          set -euo pipefail
          git rev-parse HEAD
          git rev-parse HEAD^{tree}
          python3 --version
          sha256sum audit/genesis_rigor_scan_v2.py
          sha256sum .github/workflows/genesis-rigor-scan.yml

      - name: Run deterministic scanner v2
        id: scan
        continue-on-error: true
        run: |
          set -u
          mkdir -p audit/results
          python3 audit/genesis_rigor_scan_v2.py | tee audit/results/console.txt
          status=${PIPESTATUS[0]}
          echo "exit_code=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Publish job summary
        if: ${{ always() && hashFiles('audit/results/genesis-rigor-scan-v2.md') != '' }}
        run: cat audit/results/genesis-rigor-scan-v2.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload immutable scan artifacts
        if: ${{ always() && hashFiles('audit/results/genesis-rigor-scan-v2.json') != '' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: genesis-rigor-scan-v2-${{ github.sha }}
          path: audit/results/
          if-no-files-found: error
          retention-days: 90
          include-hidden-files: false

      - name: Enforce high-confidence policy boundary
        if: always()
        run: test "${{ steps.scan.outputs.exit_code }}" = "0"
