name: Bounded theorem closure receipts

on:
  workflow_dispatch:
  push:
    branches:
      - audit/theorem-closure-receipts-20261009
    paths:
      - audit/tools/theorem_closure_scan.py
      - audit/tools/test_theorem_closure_scan.py
      - audit/tools/review_theorem_closure_receipt.py
      - audit/tools/test_review_theorem_closure_receipt.py
      - .github/workflows/theorem-closure-receipts.yml

permissions:
  contents: read

concurrency:
  group: theorem-closure-receipts-${{ github.ref }}
  cancel-in-progress: true

jobs:
  selected-theorem-closures:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Record source and scanner identities
        run: |
          set -euo pipefail
          git rev-parse HEAD
          git rev-parse HEAD^{tree}
          git rev-parse fd4aeeb2ee4fc729c18d98444fed42fd0529eeeb^{tree}
          python3 --version
          git --version
          sha256sum audit/tools/theorem_closure_scan.py
          sha256sum audit/tools/test_theorem_closure_scan.py
          sha256sum audit/tools/review_theorem_closure_receipt.py
          sha256sum audit/tools/test_review_theorem_closure_receipt.py
          sha256sum .github/workflows/theorem-closure-receipts.yml

      - name: Run hostile scanner tests
        run: |
          set -euo pipefail
          python3 -m unittest -v \
            audit/tools/test_theorem_closure_scan.py \
            audit/tools/test_review_theorem_closure_receipt.py

      - name: Generate bounded closure receipts
        id: scan
        continue-on-error: true
        run: |
          set -uo pipefail
          python3 audit/tools/theorem_closure_scan.py | tee /tmp/theorem-closure-summary.json
          status=${PIPESTATUS[0]}
          echo "exit_code=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Interpret aggregate and declaration roots
        id: review
        if: always()
        continue-on-error: true
        run: |
          set -uo pipefail
          python3 audit/tools/review_theorem_closure_receipt.py | tee /tmp/theorem-closure-review-summary.json
          status=${PIPESTATUS[0]}
          echo "exit_code=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Publish accessible reports
        if: always()
        run: |
          if test -f audit/results/theorem-closure/theorem-closure-receipt.md; then
            cat audit/results/theorem-closure/theorem-closure-receipt.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Scanner did not produce its Markdown receipt." >> "$GITHUB_STEP_SUMMARY"
          fi
          printf '\n---\n\n' >> "$GITHUB_STEP_SUMMARY"
          if test -f audit/results/theorem-closure/theorem-closure-interpretation-v2.md; then
            cat audit/results/theorem-closure/theorem-closure-interpretation-v2.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Interpretation review did not produce its Markdown receipt." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload immutable receipts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: theorem-closure-receipts-${{ github.sha }}
          path: audit/results/theorem-closure/
          if-no-files-found: error
          retention-days: 90
          include-hidden-files: false

      - name: Enforce high-confidence policy boundary
        if: always()
        run: |
          test "${{ steps.scan.outputs.exit_code }}" = "0"
          test "${{ steps.review.outputs.exit_code }}" = "0"
